# 工作流的名称。GitHub会在仓库的“Actions”标签下显示你的工作流名称
name: release
# 工作流运行的名称
run-name: release to ${{ github.ref_name }} by @${{ github.actor }}
# 定义如何触发工作流
on:
  # 手动触发工作流时
  workflow_dispatch:
  # 推送任意 tag 时
  push:
    tags:
      - v*
jobs:
  # 作业 id
  release:
    # 作业名称
    name: release new version
    # 运行作业的机器类型
    runs-on: ubuntu-latest #选择GitHub 托管运行器 linux
    permissions:
      # 允许操作创建发布
      contents: write
    #步骤
    steps:
      #步骤名称
      - name: 切分支
        #引用 GitHub Actions 市场中的 Action see:https://github.com/marketplace?type=actions
        uses: actions/checkout@main

      - name: 安装 go 环境
        uses: actions/setup-go@v6
        with:
          # 使用 go 最新的稳定版本
          go-version: 'stable'

      - name: 编译项目
        run:
          # 创建输出目录
          mkdir -p dist
          
          # 打包后文件命名格式： [项目名]-[版本号]-[操作系统]-[架构].[扩展名]
          # 编译 Linux amd64 版本
          GOOS=linux GOARCH=amd64 go build -o  dist/geeksaver-v0.0.1-linux-amd64 ./main.go
          # 编译 Windows amd64 版本
          GOOS=windows GOARCH=amd64 go build -o  dist/geeksaver-v0.0.1-windows-amd64.exe ./main.go
          # 编译 macOS amd64 版本
          GOOS=darwin GOARCH=amd64 go build -o  dist/geeksaver-v0.0.1-macos-amd64 ./main.go
          # 编译 macOS arm64 版本
          GOOS=darwin GOARCH=arm64 go build -o  dist/geeksaver-v0.0.1-macos-arm64 ./main.go

      - name: 创建 Github Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
#          bodyFile: "body.md"


